[package]
name = "groh"
version = "0.2.0"
edition = "2024"
description = "A me-first, self-hosted dashboard. Single pure-Rust binary, live Docker container cards over SSE."
license = "AGPL-3.0-only"
repository = "https://github.com/Hyphonical/Groh"
keywords = ["dashboard", "docker", "self-hosted", "sse"]
categories = ["web-programming", "command-line-utilities"]
include = ["src/**/*", "frontend/build/**/*", "Cargo.toml", "Cargo.lock", "LICENSE"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
rust-embed = "8"
bollard = { version = "0.21", default-features = false, features = ["pipe", "http"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.cargo]
unused_dependencies = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
cloned_instead_of_copied = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
match_same_arms = "warn"
unnested_or_patterns = "warn"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[lints.rust]
unreachable_pub = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 8
strip = true
panic = "abort"
